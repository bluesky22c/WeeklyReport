<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주간업무보고 뷰어</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"맑은 고딕",sans-serif;font-size:13px;display:flex;height:100vh;background:#f0f2f5}
#sidebar{width:145px;min-width:145px;background:#1e3a5f;color:white;display:flex;flex-direction:column;overflow-y:auto}
#sidebar h1{font-size:11px;padding:13px 8px;background:#152d4a;text-align:center;line-height:1.5;letter-spacing:.5px}
.person-btn{padding:11px 14px;cursor:pointer;border-bottom:1px solid #2a4f7a;font-size:13px;transition:background .15s}
.person-btn:hover{background:#2a4f7a}
.person-btn.active{background:#3a7bd5;font-weight:bold}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tab-bar{background:white;border-bottom:2px solid #3a7bd5;display:flex;flex-wrap:wrap;gap:4px;padding:7px 12px;align-items:center;min-height:46px}
.date-tab{padding:4px 11px;border-radius:4px;cursor:pointer;background:#e8eef8;font-size:12px;border:1px solid #c0cfe8;transition:background .15s;white-space:nowrap}
.date-tab:hover{background:#c8d8f0}
.date-tab.active{background:#3a7bd5;color:white;border-color:#3a7bd5;font-weight:bold}
.date-tab.edited::after{content:" ●";color:#ff6b35;font-size:9px}
.date-tab.active.edited::after{color:#ffe082}
#toolbar{background:#fff;border-bottom:1px solid #dde;padding:7px 14px;display:flex;align-items:center;gap:8px}
#toolbar h2{font-size:14px;color:#1e3a5f;flex:1}
#status{font-size:11px;color:#27ae60;min-width:120px;text-align:right}
.btn{padding:6px 13px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-family:inherit;font-weight:bold}
.btn-save{background:#3a7bd5;color:white}
.btn-save:hover{background:#2a6bc5}
.btn-export{background:#27ae60;color:white}
.btn-export:hover{background:#219a52}
.btn-reset{background:#e74c3c;color:white}
.btn-reset:hover{background:#c0392b}
.btn-reset-all{background:#7f8c8d;color:white}
.btn-reset-all:hover{background:#636e72}
#editor-wrap{flex:1;overflow-y:auto;padding:14px}
#editor{background:white;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:20px;min-height:100%;outline:none;line-height:1.7}
#editor:focus{box-shadow:0 0 0 2px #3a7bd5}
#editor table{border-collapse:collapse;width:100%;margin:6px 0}
#editor td,#editor th{border:1px solid #bbb;padding:6px 8px;vertical-align:top}
#editor th,#editor thead td{background:#ddeeff;font-weight:bold;text-align:center}
#editor tbody td{background:#fff}
#editor table:not(:has(thead)) tr:first-child td{background:#ddeeff;font-weight:bold;text-align:center}
#edit-hint{text-align:center;padding:5px;background:#fff8e1;font-size:11px;color:#999;border-top:1px solid #ffe082}
</style>
</head>
<body>
<div id="sidebar">
  <h1>📋 주간업무보고</h1>
  <div id="person-list"></div>
</div>
<div id="main">
  <div id="tab-bar"><span style="color:#aaa;font-size:12px">← 담당자를 선택하세요</span></div>
  <div id="toolbar">
    <h2 id="doc-title">담당자를 선택하세요</h2>
    <span id="status"></span>
    <button class="btn btn-save" onclick="saveToStorage()" title="Ctrl+S">💾 저장</button>
    <button class="btn btn-export" onclick="exportFile()">📥 파일 내보내기</button>
    <button class="btn btn-reset" onclick="resetCurrent()">↩ 원본복원</button>
    <button class="btn btn-reset-all" onclick="resetAll()" title="전체 편집 내용 삭제">🗑 전체초기화</button>
  </div>
  <div id="editor-wrap">
    <div id="editor" contenteditable="true"><p style="color:#bbb;text-align:center;padding:60px">담당자와 날짜를 선택하세요</p></div>
  </div>
  <div id="edit-hint">클릭하면 바로 편집 가능 &nbsp;|&nbsp; 💾 저장(Ctrl+S) &nbsp;|&nbsp; 📥 파일 내보내기로 영구 저장</div>
</div>

.14)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td></tr><tr><td><p>SEC-DS, CSS LEDoS 신뢰성 평가 설비 Setup</p></td><td><p><span>&nbsp;- 오퍼레이션</span>&nbsp;</p><p>&nbsp;- 고객사 요청사항 반영</p><p>&nbsp;- 신뢰성 설비 이동 관련 공수 체크</p><p>&nbsp;- 프로그램 버그 확인</p><ul><ul>\n</ul></ul></td><td><p>김도현</p></td><td><p></p><p><span>&nbsp;- 오퍼레이션</span>&nbsp;</p><p>&nbsp;- 고객사 요청사항 반영</p><p>&nbsp;- 프로그램 버그 확인</p><p></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p>ELP, EQ AI Agent 개발</p></td><td><p></p><p></p><p><span>​eq-agent-tuning</span></p><p><span>- 베이스 모델(Qwen3-4B) QLoRA 파인튜닝 파이프라인 구축</span></p><p><span>- 로컬 소형 모델 학습시켜 성능 확인, 도구(기능) 선택 정확도 개선</span></p><p><span>- 질문에서 필요한 값 뽑아내는 정확도 개선</span></p><p><span>- 학습·평가 데이터 생성기 구현 및 데이터 3차 확장</span></p><p><span>- 학습 반복 수행(run-0001~0010)</span></p><p><span>- 학습이 자동으로 반복되도록 환경 구축(사람이 계속 안 붙어있어도 진행)</span></p><p><span>- 검증용 서빙 환경 구축</span></p><p><span>- 사내 보고서·PPT 정리, 결과 반영</span></p><p><span>- 프로젝트 전체 진행방향 문서화</span></p><p><span><br></span></p><p><span>eq-agent-eval-harness</span></p><p></p><p><span>- 파인튜닝 외 다른 개선 방법(검색증강생성, 프롬프트 개선 등)도 같은 기준으로 비교할 수 있는 범용 검증 프로그램 신규 구축</span></p><p></p><p><span>- 현재는 골격만 구축된 단계</span></p><p></p></td><td><p>김도현</p></td><td><p><span>- 이번 주 발견된 문제 해결하는 데이터로 재학습</span></p><p><span>- 재학습 결과가 안정적으로 재현되는지 재확인</span></p><p><span>- 실제 환경과 최대한 비슷한 조건에서 다시 측정</span></p><p><span>-&nbsp;</span><span>eq-agent-eval-harness 로 테스트</span></p><p><span>- 보고서·PPT 최신 결과로 갱신</span></p><p><span>- 개발 방향 검증 및 검토, 구조적 결함, 보완점 확인 후 방향 정리 및 개선</span></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>", "2026-08-13": "<p class=\"source\">출처: [보고_제어1팀]주간업무보고서_김도현프로_20260813</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(</span><span>2026.8.3~8.7)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026.8.10~8.14)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td></tr><tr><td><p>SEC-ReliabilityAssessment System</p></td><td><p><span>&nbsp;- 고객사 요청사항 대응</span></p><p>&nbsp;- 프로그램 버그 확인</p><ul><ul>\n</ul></ul></td><td><p>김도현</p></td><td><p></p><p><span>&nbsp;- 고객사 요청사항 대응</span></p><p>&nbsp;- 프로그램 버그 확인</p><p></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p>ELP, EQ AI Agent 개발</p></td><td><p></p><p></p><p><span>​</span><span>※ 개요</span></p><p><span>&nbsp; 설비 담당자가 한국말로 물으면 프로그램이 알아서 로그·알람·레시피·설비상태를 찾아 답하는 사내 전용 AI. 외부 서비스 없이 현장 PC단독 구동이 전제라, 공개 기본 모델(4B급)을 그대로 쓰는 대신 설비 용어와 조회 규칙을 직접 가르치는(파인튜닝) 방식. 3개 축으로 진행 — 모델 학습(Tuning) / 성능 시험대(Harness) / 설비 연동(Runtime).</span></p><p><span><br></span></p><p><span>1. Tuning Part (모델 파인튜닝)</span></p><p><span><br></span></p><p><span>&nbsp; ● 파인튜닝 전(기본 모델) vs 후 - 동일 문제집 263문항 / 측정 9회</span></p><p><span>&nbsp; &nbsp; 조회 기능 선택 정확도 85.2% =&gt; 96.2% | +11.0%</span></p><p><span>&nbsp; &nbsp; 조회 조건 정확 추출 67.7% =&gt; 95.5% | +27.8%</span></p><p><span>&nbsp; &nbsp; 정해진 형식 준수 92.0% =&gt; 100% | 응답 실패0건</span></p><p><span>&nbsp; &nbsp; 질문당 응답 시간 | 약 1.2초 | 현장 PC 단독 구동&nbsp;</span></p><p><span>&nbsp; &nbsp; ○ 기본 모델은 설비 호칭·기간 표현을 못 알아들어 조회 조건 3건 중 1건이&nbsp;</span><span>틀리는 수준 → 파인튜닝 후 20건 중 19건 정확 수준</span></p><p><span>&nbsp; &nbsp; ○ 기본 모델에서 20건 발생하던 응답 실패(형식 이탈·무한 반복)는 완전 소멸</span></p><p><span><br></span></p><p><span>&nbsp; ● 향상 근거 분리 - \"기능 설명문 개선 기여\"와 \"학습 기여\"를 나눠 측정.&nbsp;</span><span>효과 없는 개선안 1건은 실측 후 폐기(감이 아니라 수치로 채택·폐기 결정)</span></p><p><span>&nbsp; ● 조건 지어내기 9건 → 0건</span></p><p><span>&nbsp; ● 제어 명령(\"검사 시작\") 학습·평가 축 신설, 신규 명령 24/24 정확 인식 확인.&nbsp;</span><span>제어 편입 후 첫 파인튜닝 런 착수(학습 606건 / 평가 355건)</span></p><p><span><br></span></p><p><span>2. Harness Part (성능 시험대)</span></p><p><span>&nbsp; ● 파인튜닝 전 기본 모델을 기준선으로 먼저 측정 → 이후 학습본을 동일 조건,</span><span>&nbsp;9회 연속 채점. 향상폭을 항목별로 비교 가능하게 함</span></p><p><span>&nbsp; ● 오답 원문 전량 보관해 유형 분해 - 설비 호칭 22건·기간 표현 13건이 전체&nbsp;</span><span>오답의 73%임을 확인, 개선 우선순위 근거로 사용</span></p><p><span>&nbsp; ● 결함 3건 발견·수정 - 무한 반복·공백 폭주로 응답이 멈추던 원인 2건(기본 모델&nbsp;</span><span>응답 실패 20건의 원인), 채점 사각지대 1건(실제 10건 누락)</span></p><p><span>&nbsp; ● 기능 목록·설명문이 3곳에 흩어져 서로 달라지던 것을 한 곳에서 배포하도록&nbsp;</span><span>정리(현재 12종) - 폐기 문구가 학습 데이터에 섞이던 사고 재발 방지</span></p><p><span><br></span></p><p><span>3. Runtime Part (설비 연동 · RAS 내장)</span></p><p><span>&nbsp; ● 조회 실데이터 연결 — 로그·알람·레시피·현재시각·택트타임·설비상태·PG상태</span></p><p><span>&nbsp; &nbsp; ○ 알람 원본이 DB 가 아니라 운전 로그의 오류 줄임을 실데이터 대조로 확인</span></p><p><span>&nbsp; &nbsp; ○ 현장 제어PC 로그 26일분으로 실제 파일 위치·택트 원본 확정</span></p><p><span>&nbsp; ● 에이전트 서버를 RAS 프로그램 안에서 구동하도록 통합(별도 프로세스 → 내장)</span></p><p><span>&nbsp; ● 제어 요청은 설비 상태(운전 중·인터락) 확인 게이트 통과 필수.</span></p><p><span>&nbsp; ● 실제 명령 전달 배선은 안전 확인 후 연결 예정(현재 미연결)</span></p><p><span>&nbsp; ● 가상 제어PC 에 현장 다용 명령 4종 보강 — 설비 없이 검증 가능</span></p><p><span>&nbsp; ● 현장 질문 이력 기록 신설 → 실사용 응답 실패 14건 원인 3종 규명·수정,</span></p><p><span>&nbsp; &nbsp; 갈라져 있던 질문 처리 경로 3곳을 하나로 통합</span></p><p><span>&nbsp; ● 제어 관련 항목 추가 구성 및 검증중</span></p><p></p></td><td><p>김도현</p></td><td><p><span>1. Tuning</span></p><p><span>&nbsp; - 신규 파인튜닝 런 완주 및 확정 측정(제어·조회 양쪽 성능 저하 확인)</span></p><p><span>&nbsp; - 남은 오답 2건 대응(조회 질문이 제어로 잘못 분류되는 경우 등)</span></p><p><span>&nbsp; - 모델 크기 확대(4B → 8B) 판단은 실사용 한계 실측 후로 유지</span></p><p><span><br></span></p><p><span>2. Harness</span></p><p><span>&nbsp; - 신규 파인튜닝 런 채점(조회 263문항 유지 확인 + 제어 45문항)</span></p><p><span>&nbsp; - 실사용 질문 기반 신규 문제집 반영</span></p><p><span>&nbsp; - 반복 측정 신뢰도 지표 확장</span></p><p><span><br></span></p><p><span>3. Runtime</span></p><p><span>&nbsp; - 제어 실행 경로 연결(안전 게이트 → 실제 명령 전달)</span></p><p><span>&nbsp; - 질문 이력에 대화 연결 정보 추가 → 실사용 다중 질문 비중 실측</span></p><p><span>&nbsp; - 신규 파인튜닝 모델 교체 후 현장 질문 재확인</span></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p>SDC-Lifetime System</p></td><td><p>&nbsp;<span>1. 원본 대조</span></p><p><span>&nbsp; &nbsp; &nbsp;- MFC 원본 저장소 확보(Lifetime.sln 81k줄) → C# 전면 대조</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>이식 기준선이 원본보다 오래된 소스임 확인, 이식 정본 재확정</span></p><p><span><br></span></p><p><span>2. Data</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>결과 dat 19 → 23컬럼 정합 + 수치 포맷 통일</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>가상모드 실측정으로 dat 실물 검증 완료</span></p><p><span><br></span></p><p><span>3. 장비 제어</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>PG 연결 판정 3단계 이식 — 무응답 PG 명령 차단</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>모터 5축 정위치 판정 인코더 실판정 적용</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>Home 완료 게이트 이식 — Home 전 셀 물리버튼 차단</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>원점 검색 중 Start 재진입(이중 실행) 결함 수정</span></p><p><span><br></span></p><p><span>4. UI / Setup</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>Start 파라미터 Device ID 결함 수정 → 가상모드 end-to-end 측정 확인</span></p><p><span>&nbsp; &nbsp; &nbsp;-</span><span> </span><span>UI 전수 감사(폼 20개·이벤트 154건), 결함 1건 처리</span></p></td><td><p><br></p></td><td><p>- 설비 셋업값 입력(설비ID, 제품코드)</p><p>- MES dat 23컬럼 스펙 확인</p><p>- PG 논리번호 ↔ 실배선 확인</p><p>- CAS140 측정·결과기록 신설</p><p>- 인터락 알람 표시 복구</p><p>- 미이식 모듈 4종 이식 여부 판단</p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>", "2026-08-20": "<p class=\"source\">출처: [보고_제어1팀]주간업무보고서_김도현프로_20260820</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(</span><span>2026.8.18~8.21)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026.8.24~8.28)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td></tr><tr><td><p>SDC-Lifetime System</p></td><td><p>&nbsp;<span>- 작업 현황 공유를 위한 CLAUDE Harness 저장소 구축 (진행 히스토리·결정 기록 관리, Claude 작업</span></p><p><span>&nbsp; &nbsp;환경 구축, 작업 현황 문서화로 Claude 환각 및 실수 감소)</span></p><p><span><br></span></p><p><span>&nbsp;- Lifetime 작업 내용 확인 및 인수인계 받음</span></p><p><span><br></span></p><p><span>&nbsp;- MFC =&gt; C# 전환 70% (기존 UI 내 기능 연결 및 동작 프로세스 작동 확인)</span></p><p><span><br></span></p><p><span>&nbsp;- MFC 원본과 전면 대조 후 미반영 기능 파악, 결과 파일 MES 스펙 정합 및 가상모드 측정,&nbsp;</span><span>end-to-end 동작 확인 완료</span></p><p><span><br></span></p><p><span>&nbsp;- 실장비 투입 전 안전 확인 체계 수립 및 확인 필요 항목 도출 (모션 축 결선, PG 배선,&nbsp;</span><span>설비ID·제품코드, FTP 전송 방침)</span></p><ul><ul>\n</ul></ul></td><td><p>김도현</p></td><td><p></p><p><span>&nbsp;</span><span>- 모션, IO 매핑, Camera align viewer 등 기능 추가 및 검증</span></p><p><span><br></span></p><p><span>&nbsp;- CLAUDE Harness 저장소 공유 및 내용 인수인계</span></p><p><span><br></span></p><p><span>&nbsp;- 테스트를 위한 가상의 설비 셋업값 정리 (model, position, testflow)</span></p><p><span><br></span></p><p><span>&nbsp;- 미이식 모듈(조명 제어, Warning 판정, CA410 사용자 보정, 전류-휘도 그래프 등) 이식</span></p><p></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p>ELP, EQ AI Agent 개발</p></td><td><p></p><p></p><p><span>​</span><span>1. 파인튜닝 현황</span></p><p><span><br></span></p><p><span>&nbsp;- 특정 도메인 지식(RAS, 계측, vision, PG 등)에 대한 LoRA 학습으로 qwen3 4B 모델과 대화 확인</span></p><p><span>&nbsp;- 다단 대화(vision 검사 후 해당 검사의 대표불량 리스트 조회, 리뷰 화면 전환 등) 처리를 위해 qwen3.5 9B 모델로 전환, QLoRA 파인튜닝 사이클 7회 진행</span></p><p><span>&nbsp;- 다단 과제 기준을 만들어 파인튜닝 전 후 모델 테스트를 비교해 개선 확인, 학습에 넣지 않은 상황(판정 조회, 불량 집계 등)에서도 개선이 있는 부분 측정하여 기록 (파인튜닝 유무에 따라, 환각 및 설비 도메인에 대한 모델 이해도가 향상됨)</span></p><p><span>&nbsp;- 기준 설비관련 질문에 대한 답변&nbsp;</span></p><p>&nbsp;=&gt; 파인튜닝 전(20/40) 후(37/40) 외에 여러방면에서 질문세트를 만들어 파인튜닝 전, 후 비교</p><p><span>&nbsp;- 파인튜닝 부작용 원인 분석 후 해결</span></p><p><span><br></span></p><p><span>2. 실제 프로그램 테스트</span></p><p><span><br></span></p><p><span>&nbsp;- RAS, RAS control 프로그램에 EQ-AGENT 프로토콜을 개설해 agent가 다룰 수 있는 도구 리스트(조회 11종·제어 명령) 구성, 해당 도구 사용을 파인튜닝</span></p><p><span>&nbsp;- 가상 설비(Virtual PC) 환경에서 EQ-AGENT 프로그램에 모델을 올려 오토런 1회를 상태 확인 → 사람 승인 → 완료 대기 → 이력 기록까지 다단 선택 동작 테스트 완료</span></p><p></p></td><td><p>김도현</p></td><td><p>1. 파인튜닝 현황</p><p><br></p><p>&nbsp;- 파인튜닝 질문세트에 40/40으로 대응이 될때까지 파인튜닝 진행 (데이터셋, 프롬프트 등을 조정해가며 파인튜닝 최적화 진행) / 질문세트의 경우 총 9벌, 400항을 갖고있음 파인튜닝 전후로 비교 질문 대응 수준 비교</p><p><br></p><p>2. 실제 프로그램 테스트</p><p><br></p><p>&nbsp;- 남은 항목: 승인 UI·대화 이력 기록의 실기동 확인, 실사용 대화 기반 검증 (질문세트로 검증되었기 때문에 실제 사용자가 테스트를 해보면서 AGENT가 가상 설비 동작을 잘 수행하는지 확인)</p><p>&nbsp;- 사용자 테스트로 생기는 질의응답 내용을 기록하여 문제가 생기는 부분에 대해 모델이 대응하게 추가학습 및 조정</p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>", "2026-08-27": "<p class=\"source\">출처: [보고_제어1팀]주간업무보고서_김도현프로_20260827</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(</span><span>2026.8.24~8.28)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026.8.31~9.4)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td></tr><tr><td><p>SDC-Lifetime System</p></td><td><p><span>1. 작업 관리 체계 정비 - Claude 기반 협업 · 형상관리 구축</span></p><p><span><br></span></p><p><span>&nbsp;- 팀원이 각자 작업한 내용을 Claude가 규칙과 문서를 기준으로 병합해, 충돌 없이 합쳐지도록 구성</span></p><p><span>&nbsp;- 작업 규칙 · 결정 사항을 문서로 고정 → 사람이 매번 개입하지 않아도 프로젝트가 일관되게 관리됨</span></p><p><span><br></span></p><p><span>2. MFC → C# 전환 약 90% 완료</span></p><p><span>&nbsp;- 남은 항목은 IO 리스트 등 하드웨어 사양을 받아야 확정 가능한 부분</span></p><p><span>&nbsp;- 실장비 투입 전 확인해야 할 안전 항목 23건을 목록화해 관리 (미확인 14 · 부분확인 9)</span></p><p><span><br></span></p><p><span>3. Claude 에이전트를 이용한 설비 프로그램 자동 분석 (가상 환경)</span></p><p><span>&nbsp;- 사람이 화면을 조작하듯 Claude가 프로그램을 직접 다루게 하여(화면 자동 조작 기술, UIA), 작동 흐름과 프로세스를 자동으로 정리</span></p><p><span>&nbsp;- 실제 설비는 연결하지 않은 가상 환경에서 진행</span></p><p><span>&nbsp;- 화면 요소 716개를 전수 정리하고, 각 조작의 위험도를 자동 분류 (단순 조회 / 설정 변경 / 설비 구동)</span></p><p><span>&nbsp;- 사람이 일일이 확인하기 어려운 경우의 수를 자동으로 훑어 취약점·보완 사항을 도출</span></p><p><span>&nbsp;- 판단과 수정 여부는 사람이 결정 - 자동화는 찾아내는 데까지, 고치는 결정은 사람이 함</span></p><p><span><br></span></p><p><span>4. AlignViewer 프로그램 이식 완료</span></p><p><span>- Basler 카메라 실물 연결 후 영상 출력까지 동작 확인</span></p><ul><ul>\n</ul></ul></td><td><p>김도현</p></td><td><p></p><p></p><p><span>1. 하드웨어 사양 반영 및 검사</span></p><p><span>&nbsp;- 전달받은 사양에 맞춰 프로그램 수정 후 검증</span></p><p><span><br></span></p><p><span>2. 전체 프로세스·경우의 수 분석 → 안전장치 적용 여부 확인</span></p><p><span>&nbsp;- Claude 에이전트가 프로그램 전체 경로를 훑어, 주요 동작에 안전장치가 실제로 걸려 있는지 점검</span></p><p><span><br></span></p><p><span>3. 가상 환경에서 기능별 동작 검증</span></p><p><span>&nbsp;- 에이전트가 기능을 하나씩 실행해, 설계대로 동작하는지 확인</span></p><p></p><p></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p>ELP, EQ AI Agent 개발</p></td><td><p></p><p></p><p></p><p><span><span>​</span><span>1. 파인튜닝(모델 학습) 현황</span></span></p><p><span><br></span></p><p><span>&nbsp;- 모델 체급 결정: 소형 모델(4B)은 설비 도메인 지식·검사 데이터 이해·데이터 조회·자연어 문답까지는 되지만, 프로그램을 실제로 제어하고 판단하는 능력이 부족해 부적합으로 판단함. → 9B · 32B 급으로 상향 진행(소비자용 그래픽카드 RTX 3090~4090 한 장에서 구동 가능한 범위)</span></p><p><span><br></span></p><p><span>&nbsp;- 접근 방식 검증 : 사람이 설비를 다룰 때 생기는 여러 경우의 수를 자동화 프로그램으로 데이터화하고, 이를 상급 AI 에이전트(Claude)가 다룰 수 있는지 먼저 확인함</span></p><p><span><br></span></p><p><span>&nbsp;- 결과 : 확인 완료 / 사전에 정의하지 않은 예외 상황까지 스스로 이해하고, 프로그램의 제어 과정 대부분을 끝까지 수행함</span></p><p><span><br></span></p><p><span>2. 실제 프로그램 테스트</span></p><p><span><br></span></p><p><span>&nbsp;-&nbsp;</span><span>프로그램만 접근 가능한 별도 통로로 제어하는 대신 작업자가 실제로 화면을 조작하는 흐름 그 자체를 에이전트도 똑같이 다루도록 연결함. 즉, 사람이 쓰는 버튼·화면을 에이전트가 같은 방식으로 사용</span></p><p><span><br></span></p><p></p><p><span>&nbsp;- 검증된 사람의 조작 절차를 \"스킬(검증된 작업 단위)\"로 만들어 두고, 에이전트는 무엇을 할지 고르고, 값을 채우고·결과를 보고하는 역할만 맡음. 실제 설비 기록으로 절차 완주를 확인함</span></p><p><br></p></td><td><p>김도현</p></td><td><p>&nbsp;- 모델 비교 측정 : Qwen3 32B와 30B-A3B(빠른 변형)를 동일 평가셋(10문항)으로 나란히 측정해, 우리 과제에 맞는 모델을 실측으로 확정</p><p><br></p><p>&nbsp;- 9B 파인튜닝 : 위에서 부족하면, 9B를 \"사용자 문장 → 알맞은 스킬 선택\" 과제로만 학습(상급 모델이 만든 정답 실행 기록을 교재로 활용). 재학습 없이 기능 추가가 가능한 구조 유지</p><p><br></p><p>&nbsp;- 완성도 점검 : 같은 지시를 표현만 바꿔 물어도 동작하는지(표현 다양성), 정의되지 않은 요청에는 \"못 함 + 이유\"를 정확히 답하는지 확인</p><p><span><br></span></p><p>- 환경 안정화 : 다른 프로그램 창이 대상 화면을 가려도 조작이 정확히 전달되도록 하는 보정을 반영 완료 / 무인 측정 신뢰도 확보</p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>", "2026-09-04": "<p class=\"source\">출처: [보고_제어1팀]주간업무보고서_김도현프로_20260904</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(</span><span>2026.8.31~9.4)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026.9.7~9.1)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td></tr><tr><td><p>SDC-Lifetime System</p></td><td><p><span>1. 설비 PC 이관 · 실행 환경 구축 완료</span></p><p><span>&nbsp;- 개발 PC 밖에서는 반드시 빌드가 실패하던 상태 해소&nbsp;</span></p><p><span>&nbsp;- 설비 PC에서 빌드·단위테스트·가상모드 기동 통과, 얼라인 뷰어 동시 실행까지 확인</span><span>&nbsp;</span></p><p><span><br></span></p><p><span>2. 실장비 연결 착수 - 장치별 부분 연결로 전환</span></p><p><span><span>&nbsp;</span>- 모션 라이브러리 버전 교체</span></p><p><span>&nbsp;- 장치별로 가상 / 실제를 따로 지정 → 준비된 장치부터 순차 연결</span></p><p><span>&nbsp;- PG 기종에 맞게 코드 수정 및 기종별 전송 방식 반영 → 모델 전송 성공</span></p><p><span>&nbsp;- 얼라인 카메라 우측 연결 완료 (좌측은 실물 필요)</span></p><p><span><br></span></p><p><span>3. 측정 알고리즘 원본 전수 대조 - 오이식 · 미이식 정정</span></p><p><span>&nbsp;- 휘도·색좌표 보정을 이 설비 원본 기준으로 재이식 → 보정 시간 3분 21초 → 40초 (약 5배 단축)</span></p><p><span>&nbsp;- 원본과 다르게 옮겨진 6건, 빠져 있던 기능 6건 발견·정정</span></p><p><span>&nbsp;- 테스트 조건 파일(.tf)을 저장하면 일부 내용이 사라지던 결함 해소</span></p><p><span>&nbsp;- 실장비 실측 검증 통과 / 4개 패턴 보정 수렴, 전압 스위프 곡선 정상</span></p><p><span><br></span></p><p><span>4. MES 반출 파일 정상화</span></p><p><span>&nbsp;- 결과 파일이 생성되지 않던 문제 해소, 설비ID·셀ID 누락 항목 보완</span></p><p><span>&nbsp;- 레퍼런스 파일과 구조 대조 통과 (7블록 구조 동일, 항목별 구간 파일 5종 생성)</span></p><p><span><br></span></p><p><span>5. 안전 점검 항목 관리</span></p><p><span>&nbsp;- IO 배선 대조 검사, 입력 62건 일치 확인</span></p><ul><ul>\n</ul></ul></td><td><p>김도현</p></td><td><p></p><p></p><p></p><p><span>1. 안전 항목 순차 종결 — 모션 없는 항목부터</span></p><p><span>- IO 신호 실측 → 축 매핑 확인 → 저속 단축 확인 순서로 진행</span></p><p><span>- IO 리스트·하드웨어 사양 입수 시 즉시 반영·검사</span></p><p><span><br></span></p><p><span>2. 확인필요 항목 처리</span></p><p><span>&nbsp;- 설비ID·라인ID·제품코드·LOT 표기 정정 (MES 반출 정합성 직결)</span></p><p><span>&nbsp;- 측정 대상 패턴 집합 정본 확인</span></p><p><br></p><p><span>3. 가상 ></p><p></p><p></p><p></p><p></p><p><span>1. 현장 배포본 설치·실행 안정화</span></p><p><span>&nbsp;- 현장 OS 대비 : 오프라인 윈도우10 등 화면 런타임이 없는 환경에서도 설치·실행</span></p><p><span>&nbsp;- 프로세스 간 충돌 예외 처리 : 허브·설비 프로그램 실행 순서 및 종료 범위 정리</span></p><p><span>&nbsp;- 실제 설치 시험에서 발견된 결함 수정, 팩·메인 버전 불일치 시 사유 표시</span></p><p><span><br></span></p><p><span>2. 화면·사용성 개선</span></p><p><span>&nbsp;- 처리 대기 중 화면 가림·조작 차단, 로딩 표시 통일</span></p><p><span>&nbsp;- 대화 내역 불러오기·내보내기 기능 추가</span></p><p><span><br></span></p><p><span>3. 기록 체계 정리</span></p><p><span>&nbsp;- 사용자에게 보이는 기록은 내부 지시문을 걸러 표시, 전체 흐름은 운행 일지·모델 호출 (</span><span>기록으로 따로 남겨 원인 추적 가능)</span></p><p><span>&nbsp;- 설비 팩도 빌드할 때마다 버전별로 보관</span></p><p><span><br></span></p><p><span>4. 답변 신뢰성 구조 개편 (예외 처리 누적 → 구조로 차단)</span></p><p><span>&nbsp;- 설비와 상관없는 모델 버릇(같은 조회 반복, 실패한 명령 재호출, 불필요한 되묻기,&nbsp;</span><span>조회하지 않은 기간을 근거로 답하기 등) 공용 코드에서 차단</span></p><p><span>&nbsp;- 설비 고유 사실·용어·기본값은 설비 팩 데이터로 분리 → 설명서 분량 축소,</span><span>&nbsp;새 설비 적용 시 재사용</span></p><p><span><br></span></p><p><span>5. 검증 및 현장 사양 확정</span></p><p><span>&nbsp;- 개편 전후 40문항 일괄 시험 결과 동일, 가상 설비 실행 검증 (과거 오동작 재현 문항 신설)</span></p><p><span>&nbsp;- 설치본에 사람처럼 이어서 묻는 시나리오를 자동으로 돌려 점검</span></p><p></p><p></p><p></p></td><td><p>김도현</p></td><td><p><span>&nbsp;- 안정화: 설치본 실사용 중 나오는 결함 수정, 장시간 운전·반복 요청에서 흔들리는 자리 점검</span></p><p><br></p><p><span>&nbsp;- 개발자 모드 기능 설계: 기존 로컬 모델로 프로그래밍 보조 관련</span></p><p><span><br></span></p><p><span>&nbsp;- 모델 교체 테스트 : 다른 회사 모델· 양자화 변경 시 같은 시험 묶음으로 비교 및 테스트</span></p></td><td><p>김도현</p></td><td><p><br></p></td></tr><tr><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>", "2026-10-23": "<p class=\"source\">출처: 김도현l제어1팀l2026-10-23 09:04:30[보고_제어1팀]주간업무보고서_김도현프로_20261023</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적</span><span>(2026.10.19~10.23)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026.10.26~10.30)</span></p></td><td><p><span>담당자</span>< td><p><span>담당자</span></p></td><td><p><span>내주계획(2026. 08. 03 ~ 08. 07)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td><td colspan=\"\"><p><span>진행율</span></p></td></tr><tr><td><p>AR System</p></td><td><p><span>1. 4x4 Sparse Blue 시료 촬상 대응</span></p><p><span>(07.27,28)</span></p><p><span><br></span></p><p><span>2. AutoReview System Filter Test 관련 일부 개선 내용 현장 적용 완료</span></p><p><span><br>3.&nbsp;</span><span>픽셀값이 정상 범위인 </span><code>0~1023</code><span>이 아닌 </span><code>0~1022</code><span>로 확인되고, <span>홀수 픽셀값이 검출되지 않는 현상에 대해 원인 분석 및 개선</span> 작업을 진행</span></p><p><span><br></span></p><p><span>-&nbsp;</span><span>기존 MIL 전체 해상도 디모자이킹 처리 과정에서 10-bit 데이터의 최하위 비트(LSB)가 손실되는 것을 확인</span></p><p><span><br></span></p><p><span>-&nbsp;</span><span>디모자이킹 처리를 OpenCV 16-bit 방식으로 변경 후 정상 결과 확인</span></p><p><br></p></td><td><p><span>박장미</span></p></td><td><p>1. 고객사 요청 사항 중 다음 작업들 적용 예정</p><p><br></p><p>&nbsp;- Image AF 시 각 Step별 산출된 선예도를 꺾은선 그래프로 시각화</p><p><br></p><p>&nbsp;- 기타 UI 편의성 작업 예정</p><p><br></p><p>&nbsp;- 시료별 Recipe 최적화</p></td><td><p><span>박장미</span></p></td><td><p><span>07.</span></p></td><td colspan=\"\"><p><br></p></td></tr></tbody></table>", "2026-08-06": "<p class=\"source\">출처: [보고_제어1팀] 주간업무보고_박장미프로_20260806</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(2026. 08. 03 ~08. 07)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026. 08. 10 ~ 08. 14)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td><td colspan=\"\"><p><span>진행율</span></p></td></tr><tr><td><p>AR System</p></td><td><p><span>1. Auto Exposure 테스트 기능 개발</span></p><p><span><br></span></p><p><span>&nbsp;- Auto Exposure 기능 사전 검증을 위한 별도 테스트 창 구성</span></p><p><span><br></span></p><p><span>&nbsp;- 기준 Exposure Time과 목표 평균 밝기, 허용 오차를 기준으로 Exposure를 자동 조절하며 재촬상하는 기능 구현</span></p><p><br></p><p>&nbsp;- Tif 이미치 드래그 앤 드롭 후 해당 이미지의 평균 밝기를 직접 계산할 수 있는 기능 추가</p><p><span><br></span></p><p><span>2. 검사 프로그램 UI 개선</span></p><p><span><br></span></p><p><span>&nbsp;- 매뉴얼 전용 Align, AF 관련 컨트롤 배치</span></p><p><span>&nbsp;</span></p><p><span>3. 고객 요청에 따라 현재 운영 실태에 맞게 Log 저장 개선</span></p><p><span><br></span></p><p>4. AMB26차(08/04), AMR24차(08/06) 촬상 대응</p></td><td><p><span>박장미</span></p></td><td><p>1. 제어 프로그램의 이력 조회 / Tact time 탭이 작동하지 않아 해당 오류 수정 예정</p><p><br></p><p>2. 검사 rod 수를 파라미터로 설정해 검사에 반영할 수 있도록 방법 고안 예정</p><p><br></p><p>3. 고객 요청 단순 수정 사항 작업 및 현장 적용 예정</p></td><td><p><span>박장미</span></p></td><td><p><span>08.</span></p></td><td colspan=\"\"><p><br></p></td></tr></tbody></table>", "2026-08-14": "<p class=\"source\">출처: 일일업무보고 메일 정리 — [AR System] 20260810~11 A/E 적용 결과 내용 및 업데이트 내역(2026-08-11 수신), [업무보고] AR AutoReview 프로그램 개선 및 검증 결과 2026-08-12(2026-08-12 수신) / 그룹웨어 주간업무보고 미제출분을 팀장 지시로 정리</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(2026. 08. 10 ~ 08. 14)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026. 08. 17 ~ 08. 21)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td><td colspan=\"\"><p><span>진행율</span></p></td></tr><tr><td><p>AR System</p></td><td><p><span>1. Auto Exposure(A/E) 기능 현장 테스트 (08/10~11)</span></p>\n<p><span><br></span></p>\n<p><span>&nbsp;- Align, Mapping, Pixel(Sparse) 검사 시퀀스별 A/E 동작 검증</span></p>\n<p><span>&nbsp;- 목표 평균 밝기, 오차 허용 범위, Threshold, ROI, 측정 채널, Exposure 범위를 기준으로 밝기를 측정하고 목표 범위 이탈 시 Exposure 자동 조정 후 재촬상하는 흐름 확인</span></p>\n<p><span>&nbsp;- Red/Green/Blue 측정 채널 및 복수 레시피 조건으로 총 68회 시험, 67회 A/E 결과 정상 반환 (1회는 시험 중 작업 중단으로 촬상 취소)</span></p>\n<p><span>&nbsp;- 완료 시험 Align 27회 / Mapping 23회 / Pixel(Sparse) 17회, 평균 보정 횟수 1.70 / 2.09 / 2.35 Step</span></p>\n<p><span>&nbsp;- 이 중 28건은 초기 촬상 조건에서 보정 없이 0Step OK 판정</span></p>\n<p><span><br></span></p>\n<p><span>2. A/E 최종값 재사용 기능 개발 (08/10~11)</span></p>\n<p><span><br></span></p>\n<p><span>&nbsp;- A/E 완료 후 최종 Exposure를 해당 시퀀스 레시피 값에 반영하고 recipe.json에 자동 저장하도록 수정</span></p>\n<p><span>&nbsp;- Align은 Align Exposure, Mapping은 Mapping Exposure, 일반 검사는 Scan Exposure, Sparse 검사는 Sparse 필터 Exposure로 분리 반영</span></p>\n<p><span>&nbsp;- 업데이트 적용 이후 레시피 반영 로그 56건 전량 정상 저장, 저장 실패 없음</span></p>\n<p><span>&nbsp;- 이전 검사에서 저장된 Exposure가 다음 검사의 Recipe Base/Start Exposure로 사용되는 연속 동작 로그 확인</span></p>\n<p><span>&nbsp;- ND 필터는 A/E 가변 제어 대상에서 제외, 시퀀스/Sparse 필터 레시피의 고정 설정값 유지</span></p>\n<p><span><br></span></p>\n<p><span>3. 고객사 요청사항 반영 및 당일 검증 (08/12)</span></p>\n<p><span><br></span></p>\n<p><span>&nbsp;- 제어 프로그램의 Tact Time / 이력 조회 탭 미연결 건 보완 완료, 고객사 요청에 맞게 화면 구성 수정</span></p>\n<p><span>&nbsp;- 화면 가장자리 픽셀 왜곡 보완을 위한 Target 영역 중앙 검사 기능 추가 — Mapping 후 유저가 선택한 NxM 영역 중간으로 Stage X,Y 이동 후 Image AF 재실행하고 검사 진행 (On/Off 선택 가능, 검증 완료)</span></p>\n<p><span>&nbsp;- Grab Point List 편집 기능 추가 — 유저가 Col, Row 입력 후 매뉴얼 Align/Mapping 완료 시 입력된 Grab Point의 X, Y를 연산해 해당 위치로 이동 (검증 진행 중)</span></p>\n<p><span><br></span></p>\n<p><span>4. 산출물 및 조회 방식 개선 (08/10~11)</span></p>\n<p><span><br></span></p>\n<p><span>&nbsp;- RESULT 파일 내용을 고객사 요청 계산식 반영하도록 수정</span></p>\n<p><span>&nbsp;- 고객사 요청에 따라 일부 산출물의 저장 방식 및 경로 변경</span></p>\n<p><span>&nbsp;- Control 프로그램의 제품 이력 및 Tact 화면을 Cell Log 기반 조회 방식으로 정리, 현장 Control 프로그램에서 정상 동작 확인</span></p></td><td><p><span>박장미</span></p></td><td><p><span>1. Grab Point List 편집·순차 촬상 기능 추가 테스트 및 최종 검증 완료 (08/14 추가 테스트분 결과 업데이트)</span></p>\n<p><span><br></span></p>\n<p><span>2. 고객사 개선 요청사항 대응 및 현장 적용 지속</span></p></td><td><p><span>박장미</span></p></td><td><p><span>08.</span></p></td><td colspan=\"\"><p><br></p></td></tr></tbody></table>", "2026-08-20": "<p class=\"source\">출처: [보고_제어1팀] 주간업무보고_박장미프로_20260820</p>\n<table><tbody><tr><td><p><span>프로젝트</span></p></td><td><p><span>금주실적(2026. 08. 20 ~08. 21)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>내주계획(2026. 08. 24 ~ 08. 28)</span></p></td><td><p><span>담당자</span></p></td><td><p><span>목표일</span></p></td><td colspan=\"\"><p><span>진행율</span></p></td></tr><tr><td><p>AR System</p></td><td><p><br></p></td><td><p><span>박장미</span></p></td><td><p>차주 월(24日) 고객사 요청으로 업데이트 내역 검증 및 프로그램 한 레시피를 가리킴. 백업 경로도 격리</p><p><br></p><p><strong>3. 시퀀스 순서 정합 + PC→PLC 정보 기록 (100%)</strong> — 전달받은 16단계와 실행 로그 대조. 스코프 스케일 설정(5번)이 트리거(7번) 뒤에 있어 첫 취득이 이전 스텝 스케일로 잡힐 수 있던 것을 트리거 대기(2초) 앞으로 이동. 주소맵에 자리는 있으나 한 번도 쓰지 않아 SFA 쪽이 계속 0이던 정보 워드를 기록 — W+0x00 RecipeNo / W+0x01 PinRecipeNo / W+0x03 ProcTime(스텝수×StepTime) / W+0x20·0x90 신호·핀 레시피명 20건</p><p><br></p><p><strong>4. 핀 접촉 불량 알람 코드 정합 (100%)</strong> — ContactCheck NG가 메시지 전문을 알람코드로 넘겨 알람화면 코드칸에 문장이 들어가고 PLC AlarmCode(W0002)는 ushort 파싱 실패로 0에 머물던 결함. 중계기판 1001 / BP기판 1002 부여</p><p><br></p><p><strong>5. 핀투핀 CSV 판정 가독성 (100%)</strong> — 개방(10억 Ω대)이 엑셀에서 1.6E+09로 접히고, 배선 모드에 따라 부등호가 뒤집히는데 기준값만 적혀 NG 이유를 표에서 알 수 없던 것. Rdc(SI 표기, 유효 3자리)·판정기준(동일 <code>≤</code> / 상이 <code>≥</code>) 열 추가, 원본 숫자는 뒤로 유지</p><p><br></p><p><strong>6. 가상모드 산출물 저장 (100%)</strong> — 가상모드에서 캡처·파형 CSV가 생성되지 않아 실물 스코프 없이는 저장 경로(폴더·파일명·쓰기)를 검증할 수 없던 것. 합성 PNG/파형으로 동일 경로 저장 → 4스텝 검증(Captures 16 · WaveData 8 · StepLog 4 · PinToPin 2 · Inspection 1). AC-/GND 기본값이 4곳에 흩어져 한 곳만 고쳐도 화면이 안 따라오던 것을 <code>PinParam.DefaultBpMinusAsGnd</code> 단일화</p><p><br></p><p><strong>7. 품질 (100%)</strong> — 자동테스트 통과 430 → <strong>503건</strong>(+73), 실패 0. 읽는 곳 없는 설정 6개 제거, 레시피 목록 Ctrl+C가 번호칸까지 복사하던 것·이름 편집이 슬롯을 조용히 덮어쓰던 것 수정, 결과 문서 숫자 소수 둘째자리 통일, 빌드 깨뜨리던 resx 정리</p><p><br></p><p><span>8. 장비 -&gt; SFA 이동</span></p></div></div><p></p><p></p></td><td rowspan=\"3\" colspan=\"1\"><p>황지환</p></td><td rowspan=\"3\" colspan=\"1\"><div><span><span><span>1.</span> </span><strong>CC-Link IE 실장비 연동 검증</strong></span><span><span> — 핸드셰이크 비트 실측, IoResetReply 응답 유지시간 확인(INDEX사한테 국번이랑 시퀀스 받아야함)</span></span></div><div><span><span><br></span></span></div><div><span><span>2.</span>&nbsp;</span><strong>핀투핀/OS 테스트 실장비 반복검증 + 스코프 디비전 확인</strong><span> — 판정 기준값 실측 반영, Time/Div·Volt/Div·트리거 동작</span></div><p><span><br></span></p><p><span><br></span></p></td><td rowspan=\"3\" colspan=\"1\"><p>황지환</p></td><td rowspan=\"3\" colspan=\"1\"><p>08.28</p></td></tr></tbody></table>", "2026-08-27": "<p class=\"so an></div><div><span>\n</span></div><div><span>3. 실장비 검증 — 트리거 배선, 비상정지, STEP 전환·유지 동작</span></div><p><span><br></span></p></td><td rowspan=\"3\" colspan=\"1\"><p>황지환</p></td><td rowspan=\"3\" colspan=\"1\"><p>10.30</p></td></tr></tbody></table>"}};

const LS_KEY = 'weeklyReport_v3';  // v2: 탐색만 해도 캐시 저장 → 재빌드 시 옛 캐시가 새 데이터를 가리는 결함. v3에서 폐기.

// 편집 시점 원본 내용의 해시 (원본이 바뀌면 옛 편집을 무효 처리)
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
// 현재 ORIGINAL과 기준 해시가 일치하는 '유효 편집'만 반환, 아니면 null (옛 캐시 무시)
function validEdit(edits,name,date){const e=edits[name]&&edits[name][date];if(!e||typeof e!=='object')return null;if(e.base!==hashStr((ORIGINAL[name]&&ORIGINAL[name][date])||''))return null;return e.content;}

});

function selectPerson(name){
  if(curPerson&&curDate) autoSave();
  curPerson=name; curDate=null;
  document.querySelectorAll('.person-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pb-'+name).classList.add('active');
  const edits=loadEdits();
  const tabBar=document.getElementById('tab-bar');
  tabBar.innerHTML='';
  const dates=Object.keys(ORIGINAL[name]).sort();
  dates.forEach(date=>{
    const tab=document.createElement('div');
    tab.className='date-tab'+(validEdit(edits,name,date)!==null?' edited':'');
    tab.textContent=date;
    tab.id='tab-'+date;
    tab.onclick=()=>selectDate(name,date);
    tabBar.appendChild(tab);
  });
  selectDate(name,dates[dates.length-1]);
}

function selectDate(name,date){
  if(curPerson===name&&curDate===date) return;
  if(curPerson&&curDate) autoSave();
  curPerson=name; curDate=date;
  document.querySelectorAll('.date-tab').forEach(t=>t.classList.remove('active'));
  const tab=document.getElementById('tab-'+date);
  if(tab) tab.classList.add('active');
  document.getElementById('doc-title').textContent=name+' — '+date+' 주간업무보고';
  const edits=loadEdits();
  const ve=validEdit(edits,name,date);
  const content=ve!==null?ve:ORIGINAL[name][date];
  document.getElementById('editor').innerHTML=content;
  dirty=false;
  setStatus('');
}

function autoSave(){
  if(!curPerson||!curDate||!dirty) return;   // 실제 편집(dirty)일 때만 저장 — 탐색만으로는 저장 안 함
  const content=document.getElementById('editor').innerHTML;
  const edits=loadEdits();
  if(!edits[curPerson]) edits[curPerson]={};
  edits[curPerson][curDate]={base:hashStr((ORIGINAL[curPerson]&&ORIGINAL[curPerson][curDate])||''), content:content};
  saveEdits(edits);
  dirty=false;
  const tab=document.getElementById('tab-'+curDate);
  if(tab) tab.classList.add('edited');
}

function saveToStorage(){
  autoSave();
  setStatus('저장됨 ✓ '+timeStr());
}

function resetCurrent(){
  if(!curPerson||!curDate) return;
  if(!confirm(curPerson+' '+curDate+' 를 원본으로 되돌리겠습니까?')) return;
  const edits=loadEdits();
  if(edits[curPerson]) delete edits[curPerson][curDate];
  saveEdits(edits);
  document.getElementById('editor').innerHTML=ORIGINAL[curPerson][curDate];
  dirty=false;
  const tab=document.getElementById('tab-'+curDate);
  if(tab) tab.classList.remove('edited');
  setStatus('원본으로 복원됨');
}

function resetAll(){
  if(!confirm('전체 담당자의 모든 편집 내용을 삭제하고 원본으로 되돌리겠습니까?')) return;
  localStorage.removeItem(LS_KEY);
  document.querySelectorAll('.date-tab').forEach(t=>t.classList.remove('edited'));
  if(curPerson&&curDate){
    document.getElementById('editor').innerHTML=ORIGINAL[curPerson][curDate];
  }
  setStatus('전체 원본으로 복원됨 ✓');
}

function exportFile(){
  autoSave();
  const edits=loadEdits();
  const merged=JSON.parse(JSON.stringify(ORIGINAL));
  for(const n of Object.keys(edits))
    for(const d of Object.keys(edits[n])){
      const ve=validEdit(edits,n,d);
      if(ve!==null && merged[n]&&merged[n][d]!==undefined) merged[n][d]=ve;
    }
  // 현재 HTML 소스의 DATA 마커 사이를 새 데이터로 교체
  const src=document.documentElement.outerHTML;
  const newData=JSON.stringify(merged);
  const newSrc=src.replace(
    /\/\/ ===DATA_START===[\s\S]*?\/\/ ===DATA_END===/,
    '// ===DATA_START===\nconst ORIGINAL = '+newData+';\n// ===DATA_END==='
  );
  const blob=new Blob([newSrc],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='index.html';
  a.click();
  setStatus('내보내기 완료 ✓ '+timeStr());
}

function setStatus(msg){document.getElementById('status').textContent=msg}
function timeStr(){const n=new Date();return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')}

let _timer=null;
document.getElementById('editor').addEventListener('input',()=>{
  dirty=true;
  clearTimeout(_timer);
  setStatus('편집 중...');
  _timer=setTimeout(()=>{autoSave();setStatus('자동저장됨 '+timeStr())},3000);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveToStorage();}
});
</script>
